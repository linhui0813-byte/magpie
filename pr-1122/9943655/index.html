<main><h1>#1122 界面预览</h1><p class="m">commit 9943655 · <a href="https://github.com/yetone/magpie/pull/1122">回到 PR</a> · 供应商页多了 Google Vertex AI 预设：添加面板里选中它，编辑器用「项目 ID / 位置 / 凭据文件 / 服务账号」四栏取代 API 密钥，未填项目 ID 时保存被拒，填好后下方的「端点」显示该项目与位置对应的地址；列表里该供应商的徽标显示签名用的凭据（服务账号、凭据文件或 Google 默认凭据）。用量「请求」列表也把 Gemini 的 streamGenerateContent 请求标为 Gemini。</p>
